# Render blueprint — the realtime server (CLAUDE.md §7.1).
#
# Vercel hosts the Next.js UI; Render hosts this. The split is not a
# preference: Vercel's serverless functions cannot hold persistent WebSocket
# connections, and Socket.io needs a long-running process.

services:
  - type: web
    name: beatz-realtime
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm run server:start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: '22'
      - key: PORT
        # Render injects the real port; the server reads process.env.PORT.
        value: '3001'
      - key: ALLOWED_ORIGINS
        # Comma-separated. Include the Vercel deployment and the Capacitor
        # origin — the APK's WebView serves from https://localhost.
        sync: false
      - key: REDIS_URL
        # Optional today (state is in-memory). Required before running more
        # than one instance: room state must be shared, not per-process.
        sync: false
      # The card pool. NOT optional and NOT only about recording: every
      # card:play is resolved against the `cards` table, so a server without
      # these answers CARD_NOT_FOUND to every play. No reign starts, nothing
      # is audible to anyone, and the room looks broken rather than
      # unconfigured. That is exactly what happened in production.
      #
      # Both values are public — the same pair is compiled into the APK, and
      # `cards` is world-readable under RLS — so they are declared here
      # rather than left as `sync: false` secrets somebody has to remember.
      # A deploy from this blueprint configures itself.
      - key: SUPABASE_URL
        value: https://ezrsnhpgklqcrnajigpc.supabase.co
      - key: SUPABASE_ANON_KEY
        # Publishable key. Reads the card catalogue; RLS does the guarding.
        value: sb_publishable_mlfvAP-kLrWLbQYpR5T6Ow_fRfyPXFF
      - key: SUPABASE_SERVICE_ROLE_KEY
        # Supabase dashboard -> Project Settings -> API -> service_role.
        # Bypasses RLS, which is why only this trusted server process may
        # hold it: it writes reigns on behalf of whoever holds the throne.
        # Never give it a NEXT_PUBLIC_ prefix and never commit it.
        sync: false

# NOTE ON THE FREE PLAN: Render spins free instances down after ~15 minutes
# idle, and a cold start takes 30-60s. For a live demo either upgrade, or
# hit /health a few minutes beforehand to wake it.
# See docs/DEMO_FALLBACKS.md (hour-before).
